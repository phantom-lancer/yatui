name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  linux:
    name: Linux
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go build -trimpath -ldflags="-w -s" -o yatui-linux-amd64
          go build -trimpath -ldflags="-w -s" -tags=nomedia -o yatui-linux-amd64-nomedia
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" yatui-linux-amd64 yatui-linux-amd64-nomedia --clobber

  windows:
    name: Windows
    needs: create
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go build -trimpath -ldflags="-w -s" -o yatui-windows-amd64.exe
          go build -trimpath -ldflags="-w -s" -tags=nomedia -o yatui-windows-amd64-nomedia.exe
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" yatui-windows-amd64.exe yatui-windows-amd64-nomedia.exe --clobber

  checksums:
    name: Checksums
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --dir dist
      - name: Compute
        run: |
          cd dist
          sha256sum yatui-linux-amd64 yatui-linux-amd64-nomedia \
            yatui-windows-amd64.exe yatui-windows-amd64-nomedia.exe > SHA256SUMS
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
