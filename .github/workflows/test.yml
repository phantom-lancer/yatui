name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed for:"
            echo "$files"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: test MP3 seek fork
        run: go test ./... -count=1
        working-directory: third_party/go-stream-mp3

      - name: build
        run: go build ./...

      - name: build without media integrations
        run: go build -tags=nomedia ./...

  race:
    name: race (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The audio path, the visualizer worker and the cache are shared by
      # several goroutines; the race detector is the only reliable guard
      # against a data race creeping back into them.
      - name: race tests
        run: go test -race ./... -count=1

      - name: race tests of the MP3 seek fork
        run: go test -race ./... -count=1
        working-directory: third_party/go-stream-mp3
